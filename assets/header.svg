<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-label="Shubham Dwivedi, AI engineer" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
  <linearGradient id="eq" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#00F0FF"/>
    <stop offset="0.5" stop-color="#8B5CF6"/>
    <stop offset="1" stop-color="#FF2BD6"/>
  </linearGradient>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#ffffff" opacity="0.035"/>
  </pattern>
  <radialGradient id="glow" cx="50%" cy="45%" r="55%">
    <stop offset="0" stop-color="#2A0F4A" stop-opacity="0.9"/>
    <stop offset="1" stop-color="#05040A" stop-opacity="0"/>
  </radialGradient>
  <clipPath id="frame"><rect width="900" height="250" rx="10"/></clipPath>
  <clipPath id="slice"><rect class="slicebox" x="0" y="78" width="900" height="14"/></clipPath>
</defs>
<style>
  .mono { font-family: "JetBrains Mono","SF Mono",Menlo,Consolas,"Liberation Mono",monospace; }
  .name { font-size: 54px; font-weight: 800; letter-spacing: 7px; }
  .hud { font-size: 11px; fill: #6E6890; letter-spacing: 1.5px; }
  .sub { font-size: 15px; fill: #9FF8FF; letter-spacing: 3px; }
  .bar { fill: url(#eq); transform-box: fill-box; transform-origin: 50% 100%; animation: pump .4615s cubic-bezier(.2,.9,.3,1) infinite; opacity:.9 }
  .b { animation-duration: .923s; }
  .c { animation-duration: .2308s; opacity:.6 }
  @keyframes pump { 0% { transform: scaleY(1); } 20% { transform: scaleY(.25); } 100% { transform: scaleY(1); } }
  .cy { fill: #00F0FF; animation: gx 3.2s steps(1) infinite; }
  .mg { fill: #FF2BD6; animation: gx2 3.2s steps(1) infinite; }
  @keyframes gx  { 0%,86%,100% { transform: translate(0,0); } 88% { transform: translate(-9px,1px); } 91% { transform: translate(5px,-2px); } 94% { transform: translate(-4px,0); } }
  @keyframes gx2 { 0%,86%,100% { transform: translate(0,0); } 88% { transform: translate(8px,-1px); } 91% { transform: translate(-6px,2px); } 94% { transform: translate(3px,0); } }
  .slice { opacity: 0; animation: sl 3.2s steps(1) infinite; }
  @keyframes sl { 0%,87%,96%,100% { opacity:0; transform: translateX(0); } 88% { opacity:1; transform: translateX(14px); } 92% { opacity:1; transform: translateX(-10px); } }
  .sweep { animation: sw 5s linear infinite; }
  @keyframes sw { 0% { transform: translateY(-10px); } 100% { transform: translateY(260px); } }
  .blink { animation: bl 1s steps(1) infinite; }
  @keyframes bl { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
